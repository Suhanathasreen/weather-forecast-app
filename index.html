<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple student Weather Forecast App." />
  <title>Weather Forecast App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">WEATHER DASHBOARD</p>
        <h1>Weather Forecast</h1>
        <p class="subtitle">Check current weather for any city.</p>
      </div>
      <div class="sun-icon" aria-hidden="true">☀️</div>
    </header>

    <form id="search-form" class="search-form">
      <label class="sr-only" for="city-input">City name</label>
      <input id="city-input" type="text" placeholder="Enter a city (e.g. Hyderabad)" autocomplete="off" required />
      <button type="submit">Search</button>
    </form>

    <p id="status" class="status" role="status">Enter a city to see its weather.</p>

    <section id="weather" class="weather-card hidden" aria-live="polite">
      <div class="weather-top">
        <div>
          <p id="location" class="location"></p>
          <p id="condition" class="condition"></p>
        </div>
        <div id="weather-icon" class="weather-icon" aria-hidden="true">🌤️</div>
      </div>
      <div class="temperature-row">
        <p id="temperature" class="temperature">--°C</p>
        <p id="feels-like" class="feels-like"></p>
      </div>
      <div class="details">
        <div class="detail"><span>💧 Humidity</span><strong id="humidity">--%</strong></div>
        <div class="detail"><span>💨 Wind</span><strong id="wind">-- km/h</strong></div>
        <div class="detail"><span>🌡️ Pressure</span><strong id="pressure">-- hPa</strong></div>
      </div>
    </section>

    <footer>
      <p>Student project · Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
